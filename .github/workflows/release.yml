name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # changesets/action v2 pushes release commits and tags through the
      # GitHub API, so git credentials do not need to persist on this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: latest
          cache: true
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: just,jaq,git-stats
      - run: just install
      - name: Create Release Pull Request or Tag
        uses: changesets/action@22ccf9aa43179fe9e27dc62e575971d28cce197c # v2.0.0
        with:
          version-script: just version
          publish-script: just publish
          commit-message: "chore(release): bump version"
          pr-title: "chore(release): bump version"
        env:
          # The action authenticates itself through the github-token input, but
          # @changesets/changelog-github still reads GITHUB_TOKEN from the
          # environment to look up PR and commit metadata.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
