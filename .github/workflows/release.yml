name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # changesets/action v2 pushes release commits and tags through the
      # GitHub API, so git credentials do not need to persist on this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: latest
          cache: true
      - uses: taiki-e/install-action@3d7d7cd5ac7f994c1892ae0c06165095b9139094 # v2.85.1
        with:
          tool: just,jaq,git-stats
      - run: just install
      - name: Create Release Pull Request or Tag
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: just version
          publish-script: just publish
          commit-message: "chore(release): bump version"
          pr-title: "chore(release): bump version"
        env:
          # The action authenticates itself through the github-token input, but
          # @changesets/changelog-github still reads GITHUB_TOKEN from the
          # environment to look up PR and commit metadata.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
